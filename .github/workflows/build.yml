name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

# 同一分支上新的推送取消旧的运行：PR 只看最新的提交，main 上也只有最新那次的产物有用
# A newer push to the same branch cancels the older run: a pull request is judged on its
# newest commit, and on main only the newest build's artifacts are of any use
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 正式构建出的是发版用的二进制，只在推到 main 和手动触发时跑；PR 上由 cross-check 只编译、不出产物
  # The release builds make the binaries a release ships, so they run on pushes to main and by
  # hand; on a pull request cross-check compiles for each platform without building artifacts
  build-windows:
    name: Build Windows ${{ matrix.arch }} gnullvm
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-gnullvm
            arch: x86_64
            runner: windows-latest
          - target: aarch64-pc-windows-gnullvm
            arch: arm64
            runner: windows-11-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install MSYS2 x86_64 toolchain
        if: matrix.arch == 'x86_64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-llvm
            mingw-w64-clang-x86_64-rust

      - name: Install MSYS2 aarch64 toolchain
        if: matrix.arch == 'arm64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-lld
            mingw-w64-clang-aarch64-llvm
            mingw-w64-clang-aarch64-rust

      - name: Build
        shell: msys2 {0}
        run: |
          cargo build --release --target ${{ matrix.target }}
          strip target/${{ matrix.target }}/release/kixdns.exe || true

      - name: Package
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/kixdns.exe dist/kixdns-windows-${{ matrix.arch }}.exe

      - name: Upload CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: kixdns-windows-${{ matrix.arch }}.exe
          path: dist/kixdns-windows-${{ matrix.arch }}.exe
          retention-days: 30

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/kixdns-windows-${{ matrix.arch }}.exe

  build-linux:
    name: Build Linux ${{ matrix.arch }} ${{ matrix.toolset }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
            runner: ubuntu-24.04
            toolset: gnu
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            runner: ubuntu-24.04-arm
            toolset: gnu
          - target: x86_64-unknown-linux-musl
            arch: x86_64
            runner: ubuntu-24.04
            toolset: musl
          - target: aarch64-unknown-linux-musl
            arch: arm64
            runner: ubuntu-24.04-arm
            toolset: musl

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install musl toolchain
        if: matrix.toolset == 'musl'
        timeout-minutes: 20
        run: |
          # apt 偶尔卡在一条不动的连接上，自己的超时不管用，一等就是一个多小时（这台构建机的镜像连不上，退到
          # archive.ubuntu.com 以后读完一个 InRelease 就再没动静）。每次最多等 5 分钟，卡住就重来，最多 3 次
          # apt now and then hangs on a connection that does not move, which its own timeouts do not
          # catch, for over an hour (the runner's mirror unreachable, it turned to archive.ubuntu.com
          # and went still after one InRelease). Each try gets at most 5 minutes, and a stuck one is
          # tried again, 3 times at most
          for attempt in 1 2 3; do
            sudo timeout 300 apt-get -o Acquire::Retries=3 update \
              && sudo timeout 300 apt-get -o Acquire::Retries=3 install -y musl-tools musl-dev \
              && exit 0
            echo "apt attempt $attempt failed"
          done
          exit 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: |
          cargo build --release --target ${{ matrix.target }}
          strip target/${{ matrix.target }}/release/kixdns || true

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/kixdns dist/kixdns-linux-${{ matrix.arch }}-${{ matrix.toolset }}

      - name: Upload CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: kixdns-linux-${{ matrix.arch }}-${{ matrix.toolset }}
          path: dist/kixdns-linux-${{ matrix.arch }}-${{ matrix.toolset }}
          retention-days: 30

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/kixdns-linux-${{ matrix.arch }}-${{ matrix.toolset }}

  build-freebsd:
    name: Build FreeBSD ${{ matrix.arch }} (cross)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-freebsd
            arch: x86_64
            toolchain: stable
            build_std: ""
          - target: aarch64-unknown-freebsd
            arch: arm64
            toolchain: nightly
            build_std: "-Z build-std=std,panic_abort"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ matrix.toolchain }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.toolchain }}-

      - name: Cache target (per target)
        uses: actions/cache@v5
        with:
          path: target/${{ matrix.target }}
          key: ${{ runner.os }}-target-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-${{ matrix.target }}-

      - name: Install toolchain and cross
        run: |
          if ! command -v cross >/dev/null 2>&1; then
            cargo install cross --git https://github.com/cross-rs/cross
          else
            echo "cross already installed, skip install"
          fi
          rustup toolchain install ${{ matrix.toolchain }}
          rustup component add rust-src --toolchain ${{ matrix.toolchain }}

      - name: Build FreeBSD ${{ matrix.arch }}
        run: |
          if [ -n "${{ matrix.build_std }}" ]; then
            cross +${{ matrix.toolchain }} build --target ${{ matrix.target }} ${{ matrix.build_std }} --release
          else
            cross +${{ matrix.toolchain }} build --target ${{ matrix.target }} --release
          fi
          strip target/${{ matrix.target }}/release/kixdns || true

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/kixdns dist/kixdns-freebsd-${{ matrix.arch }}

      - name: Upload CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: kixdns-freebsd-${{ matrix.arch }}
          path: dist/kixdns-freebsd-${{ matrix.arch }}
          retention-days: 30

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/kixdns-freebsd-${{ matrix.arch }}

  # 各平台只在那个平台上编译的代码（cfg(windows)、BSD、musl/arm64），测试代码也算，在 Linux 上用 zig 交叉编译跑
  # clippy：几分钟，不出产物。Linux 本身的 clippy 和测试在 panel-release.yml 的 Verify 里
  # The code each platform alone compiles (cfg(windows), BSD, musl/arm64), the tests' included,
  # checked with clippy cross-compiled through zig on Linux: a few minutes and no artifacts.
  # Linux's own clippy and tests are in Verify, panel-release.yml
  cross-check:
    name: Cross check (Windows, FreeBSD, arm64 musl)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-gnu, x86_64-unknown-freebsd, aarch64-unknown-linux-musl

      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.24.1

      - name: Cache build
        uses: Swatinem/rust-cache@v2

      - name: Clippy for Windows
        run: cargo-zigbuild clippy --locked --target x86_64-pc-windows-gnu --all-targets -- -D warnings

      - name: Clippy for FreeBSD
        run: cargo-zigbuild clippy --locked --target x86_64-unknown-freebsd --all-targets -- -D warnings

      - name: Clippy for arm64 musl
        run: cargo-zigbuild clippy --locked --target aarch64-unknown-linux-musl --all-targets -- -D warnings

  audit-linux:
    name: Audit dependencies (RustSec)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Cargo.lock against the RustSec advisory database
        run: cargo audit --deny warnings
